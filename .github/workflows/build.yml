name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set: the APK is signed with a throwaway debug key and cannot update an installed app"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk CalCalc.apk
          else
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk CalCalc.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CalCalc-${{ github.run_number }}
          path: CalCalc.apk

      # Each signed build on main becomes the latest release; the app reads version.json from it
      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          sha=$(sha256sum CalCalc.apk | cut -d' ' -f1)
          notes=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.1.$N/CalCalc.apk"
          printf '{"versionCode":%s,"versionName":"0.1.%s","apkUrl":"%s","sha256":"%s","notes":"%s"}\n' "$N" "$N" "$url" "$sha" "$notes" > version.json
          gh release create "v0.1.$N" CalCalc.apk version.json --title "CalCalc 0.1.$N" --notes "$notes" --latest
