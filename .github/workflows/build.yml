name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set: the APK is signed with a throwaway debug key and cannot update an installed app"
          fi

      - name: Unit tests and screenshots
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: app/build/outputs/roborazzi/

      # the pictures also go to a branch screenshots/<branch>, so they can be fetched with plain git
      - name: Publish screenshots
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls app/build/outputs/roborazzi/*.png >/dev/null 2>&1 || exit 0
          d=$(mktemp -d); cp app/build/outputs/roborazzi/*.png "$d"/; cd "$d"
          git init -q -b shots && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "shots:refs/heads/screenshots/${GITHUB_REF_NAME}"

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk CalCalc.apk
          else
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk CalCalc.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CalCalc-${{ github.run_number }}
          path: CalCalc.apk

      # Each signed build on main becomes the latest release; the app reads version.json from it
      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          sha=$(sha256sum CalCalc.apk | cut -d' ' -f1)
          # what's new, in Russian, for the update banner; empty when the file is missing
          notes=$(cat .github/release-notes.txt 2>/dev/null | tr '\n' ' ' | sed 's/"/\\"/g; s/ *$//')
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.1.$N/CalCalc.apk"
          printf '{"versionCode":%s,"versionName":"0.1.%s","apkUrl":"%s","sha256":"%s","notes":"%s"}\n' "$N" "$N" "$url" "$sha" "$notes" > version.json
          gh release create "v0.1.$N" CalCalc.apk version.json --title "CalCalc 0.1.$N" --notes "$notes" --latest

  # the same app on a real Android emulator with the system keyboard, screenshots go to screenshots/<branch>-device
  device:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk CalCalc-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/ui-smoke.sh
      - name: Publish device screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots-device/*.png >/dev/null 2>&1 || exit 0
          cd shots-device
          git init -q -b shots && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "device screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "shots:refs/heads/screenshots/${GITHUB_REF_NAME}-device"
